/* ═══════════ 1. 語言/注音工具 ═══════════ */
const ZY_RE = /[ㄅ-ㄯˉˊˇˋ˙]/;
const ZY_ALL = /[ㄅ-ㄯˉˊˇˋ˙]/g;

/** 去掉注音,取得純中文 */
const strip = (s) => (s || "").replace(ZY_ALL, "");

/** 把內嵌注音字串切成 [{c:字, z:注音}];標點的 z 為空字串 */
function seg(s) {
  const out = [];
  for (const ch of s || "") {
    if (ZY_RE.test(ch) && out.length && out[out.length - 1].c)
      out[out.length - 1].z += ch;
    else out.push(ZY_RE.test(ch) ? { c: "", z: ch } : { c: ch, z: "" });
  }
  return out;
}

/** 取得某語言的「純文字」(給語音、下載、placeholder 用) */
function textOf(lang, pair) {
  return lang === "en" ? pair.en : strip(pair.zh);
}

/** 取得某語言的「渲染資料」 */
function segOf(lang, pair) {
  if (lang === "en") return { mode: "plain", text: pair.en };
  if (lang === "zh") return { mode: "plain", text: strip(pair.zh) };
  return { mode: "ruby", units: seg(pair.zh) };
}

/* ═══════════ 3. 流程狀態機資料 ═══════════ */
const FLOW = {
  start:  {next:"comic",  back:null},
  comic:  {next:"mission",back:"start"},
  mission:{next:"step1",  back:"comic"},
  step1:  {next:"step1b", back:"mission"},

/** 進度條百分比 */
const PROGRESS = {start:0,comic:14,mission:28,step1:42,step1b:56,step2:70,step3:82,resp:92,end:100};

const SPLASH_OF = {step1:1,step2:2,step3:3};

/* ═══════════ 4. 語音(Web Speech API) ═══════════ */
function stopSpeech(){
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function speak(lang, txt){
  if (!("speechSynthesis" in window) || !txt) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = lang === "en" ? "en-US" : "zh-TW";
  u.rate = 0.95;
  const vs = window.speechSynthesis.getVoices();
  const v = vs.find(v=>v.lang.replace("_","-").startsWith(u.lang))
        || vs.find(v=>v.lang.startsWith(lang==="en"?"en":"zh"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
const speakPair = (lang, pair) => speak(lang, textOf(lang, pair));

/* ═══════════ 5. 回應與答案邏輯 ═══════════ */
const RESP_MAP = {space:[0,2], listen:[0,1], walk:[0,1], other:[0,1,2]};
function pickResponse(actionKey, rng=Math.random){
  const arr = RESP_MAP[actionKey] || [0,1,2];
  return arr[Math.floor(rng()*arr.length)];
}

const EMPTY_ANSWERS = {
  emotion:null,
  emotionText:"",
  need:null,
  needText:"",
  action:null,
  actionText:"",
  resp:null,
  draw:null,
};

function answerSummary(lang, ans){
  const need = ans.need==="other" ? (ans.needText||textOf(lang,STR.dlEmpty))
    : ans.need ? textOf(lang, STR[{space:"n1",listen:"n2",walk:"n3"}[ans.need]]) : "—";
  const action = ans.action==="other" ? (ans.actionText||textOf(lang,STR.dlEmpty))
    : ans.action ? textOf(lang, STR[{space:"a1",listen:"a2",walk:"a3"}[ans.action]]) : "—";
  const emotion = ans.emotion==="other" ? (ans.emotionText||"—")
    : ans.emotion ? textOf(lang, EMO[ans.emotion]) : "—";
  const response = ans.resp!=null ? textOf(lang, STR["r"+(ans.resp+1)]) : "—";
  return {emotion, need, action, response};
}

function generateAnswerCardPNG(lang, ans, {fontFamily="'Noto Sans TC',sans-serif"}={}){
  return new Promise(resolve=>{
    const cv=document.createElement("canvas"); cv.width=880; cv.height=1240;
    const ctx=cv.getContext("2d");
    const P=k=>textOf(lang,STR[k]);
    const wrap=(text,x,y,maxW,lh)=>{
      let line="",yy=y;
      for(const ch of text){
        if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
        else line+=ch;
      }
      ctx.fillText(line,x,yy); return yy+lh;
    };
    ctx.fillStyle="#FDF9F3"; ctx.fillRect(0,0,880,1240);
    ctx.strokeStyle="#F5B94E"; ctx.lineWidth=12; ctx.strokeRect(12,12,856,1216);
    ctx.fillStyle="#E0524B"; ctx.font="bold 42px "+fontFamily; ctx.textAlign="center";
    ctx.fillText(P("dlTitle"),440,96);
    ctx.fillStyle="#8A7A63"; ctx.font="24px "+fontFamily;
    ctx.fillText(P("dlScene"),440,142);
    ctx.textAlign="left";
    const sum=answerSummary(lang,ans);
    let y=210;
    const item=(label,val)=>{
      ctx.fillStyle="#C98A2E"; ctx.font="bold 26px "+fontFamily;
      y=wrap(label,70,y,740,38);
      ctx.fillStyle="#4A4160"; ctx.font="bold 32px "+fontFamily;
      y=wrap(val,70,y+6,740,46)+26;
    };
    item(P("dlQ1"),sum.emotion);
    item(P("dlQ2"),sum.need);
    item(P("dlQ3"),sum.action);
    item(P("dlR"),sum.response);
    const fin=()=>{
      ctx.fillStyle="#E0524B"; ctx.font="bold 28px "+fontFamily; ctx.textAlign="center";
      ctx.fillText(P("dlFoot"),440,1150);
      ctx.fillStyle="#8A7A63"; ctx.font="22px "+fontFamily;
      ctx.fillText(P("dlDate")+": "+new Date().toLocaleDateString(),440,1190);
      cv.toBlob(resolve);
    };
    if(ans.draw){
      ctx.fillStyle="#C98A2E"; ctx.font="bold 26px "+fontFamily;
      ctx.fillText(P("dlDraw"),70,y);
      const im=new Image();
      im.onload=()=>{
        ctx.fillStyle="#fff"; ctx.fillRect(70,y+14,330,258);
        ctx.drawImage(im,70,y+14,330,258);
        ctx.strokeStyle="#E3D4AD"; ctx.lineWidth=4; ctx.strokeRect(70,y+14,330,258);
        fin();
      };
      im.src=ans.draw;
    } else fin();
  });
}
async function downloadAnswerCard(lang, ans, opts){
  const blob=await generateAnswerCardPNG(lang, ans, opts);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(lang==="en"?"my_answers_emotion_defuser":"我的答案_情緒拆彈隊")+".png";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ═══════════ 6. React Hooks ═══════════ */
function useEmotionDefuser({
  initialLang="zy",
  splashInMs=1350,
  splashOutMs=500,
  autoSpeak=true,
  advanceDelayMs=350,
}={}){
  const [lang,setLang]=useState(initialLang);
  const [screen,setScreen]=useState("start");
  const [splash,setSplash]=useState(null);
  const [answers,setAnswers]=useState(EMPTY_ANSWERS);
  const timers=useRef([]);
  const later=(fn,ms)=>{timers.current.push(setTimeout(fn,ms));};
  useEffect(()=>()=>{timers.current.forEach(clearTimeout);stopSpeech();},[]);

  const goTo=useCallback((scr)=>{
    stopSpeech();
    setScreen(scr);
    const n=SPLASH_OF[scr];
    if(n){
      setSplash({n,out:false});
      if(autoSpeak) speakPair(lang, STR["step"+n]);
      later(()=>setSplash(s=>s&&{...s,out:true}),splashInMs);
      later(()=>setSplash(null),splashInMs+splashOutMs);
    }
  },[lang,autoSpeak,splashInMs,splashOutMs]);

  const next=useCallback(()=>{const t=FLOW[screen]?.next;if(t)goTo(t);},[screen,goTo]);
  const back=useCallback(()=>{
    const t=FLOW[screen]?.back;
    if(!t)return;
    if(screen==="resp") setAnswers(a=>({...a,resp:null}));
    goTo(t);
  },[screen,goTo]);
  const restart=useCallback(()=>{setAnswers(EMPTY_ANSWERS);goTo("start");},[goTo]);

  const pickEmotion=useCallback((key)=>{
    setAnswers(a=>({...a,emotion:key,emotionText:""}));
    if(autoSpeak) speakPair(lang,EMO[key]);
    later(()=>goTo("step1b"),advanceDelayMs);
  },[lang,goTo,autoSpeak,advanceDelayMs]);
  const pickEmotionOther=useCallback((text)=>{
    if(!text?.trim())return false;
    setAnswers(a=>({...a,emotion:"other",emotionText:text.trim()}));
    goTo("step1b"); return true;
  },[goTo]);

  const pickNeed=useCallback((key)=>{
    setAnswers(a=>({...a,need:key,needText:""}));
    if(autoSpeak) speakPair(lang,STR[CHOICES.need.find(c=>c.key===key).strKey]);
    later(()=>goTo("step3"),advanceDelayMs);
  },[lang,goTo,autoSpeak,advanceDelayMs]);
  const pickNeedOther=useCallback((text)=>{
    if(!text?.trim())return false;
    setAnswers(a=>({...a,need:"other",needText:text.trim()}));
    goTo("step3"); return true;
  },[goTo]);

  const commitAction=useCallback((key,text)=>{
    const resp=pickResponse(key);
    setAnswers(a=>({...a,action:key,actionText:text||"",resp}));
    if(autoSpeak) later(()=>speakPair(lang,STR["r"+(resp+1)]),650);
  },[lang,autoSpeak]);
  const pickAction=useCallback((key)=>{
    if(autoSpeak) speakPair(lang,STR[CHOICES.action.find(c=>c.key===key).strKey]);
    commitAction(key,"");
    later(()=>goTo("resp"),advanceDelayMs);
  },[lang,goTo,autoSpeak,advanceDelayMs,commitAction]);
  const pickActionOther=useCallback((text)=>{
    if(!text?.trim())return false;
    commitAction("other",text.trim());
    goTo("resp"); return true;
  },[goTo,commitAction]);

  const setDrawing=useCallback((dataURL)=>setAnswers(a=>({...a,draw:dataURL})),[]);

  return {
    lang,setLang, screen, splash, answers,
    progress: PROGRESS[screen] ?? 0,
    respKey: answers.resp!=null ? "r"+(answers.resp+1) : null,
    goTo, next, back, restart,
    pickEmotion, pickEmotionOther,
    pickNeed, pickNeedOther,
    pickAction, pickActionOther,
    setDrawing,
    say:(pairOrKey)=>speakPair(lang, typeof pairOrKey==="string"?STR[pairOrKey]:pairOrKey),
    text:(pairOrKey)=>textOf(lang, typeof pairOrKey==="string"?STR[pairOrKey]:pairOrKey),
    render:(pairOrKey)=>segOf(lang, typeof pairOrKey==="string"?STR[pairOrKey]:pairOrKey),
    summary:()=>answerSummary(lang,answers),
    download:(opts)=>downloadAnswerCard(lang,answers,opts),
  };
}

function useDrawingPad({canvasRef, initialImage=null, onChange,
  penWidth=5, eraserWidth=24, background="#fff"}){
  const [color,setColor]=useState("#4A4160");
  const [erase,setErase]=useState(false);
  const S=useRef({drawing:false,prev:null,color:"#4A4160",erase:false});
  useEffect(()=>{S.current.color=color;S.current.erase=erase;},[color,erase]);
  useEffect(()=>{
    const cv=canvasRef.current; if(!cv)return;
    const ctx=cv.getContext("2d");
    ctx.fillStyle=background; ctx.fillRect(0,0,cv.width,cv.height);
    if(initialImage){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=initialImage;}
    ctx.lineCap="round"; ctx.lineJoin="round";
    const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
      return{x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)};};
    const st=e=>{S.current.drawing=true;S.current.prev=pos(e);e.preventDefault();};
    const mv=e=>{if(!S.current.drawing)return;const p=pos(e);
      ctx.strokeStyle=S.current.erase?background:S.current.color;
      ctx.lineWidth=S.current.erase?eraserWidth:penWidth;
      ctx.beginPath();ctx.moveTo(S.current.prev.x,S.current.prev.y);ctx.lineTo(p.x,p.y);ctx.stroke();
      S.current.prev=p;e.preventDefault();};
    const en=()=>{if(S.current.drawing){S.current.drawing=false;onChange?.(cv.toDataURL("image/png"));}};
    cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);
    cv.addEventListener("touchstart",st,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",en);
    return()=>{
      cv.removeEventListener("mousedown",st);cv.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",en);
      cv.removeEventListener("touchstart",st);cv.removeEventListener("touchmove",mv);cv.removeEventListener("touchend",en);
    };
  },[]); // eslint-disable-line
  const clear=useCallback(()=>{
    const cv=canvasRef.current; if(!cv)return;
    const ctx=cv.getContext("2d");
    ctx.fillStyle=background; ctx.fillRect(0,0,cv.width,cv.height);
    onChange?.(null);
  },[background,onChange]);
  return {color,setColor,erase,setErase,clear};
}

function useCamera({videoRef}){
  const [on,setOn]=useState(false);
  const [error,setError]=useState(null);
  const streamRef=useRef(null);
  const stop=useCallback(()=>{
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    setOn(false);
  },[]);
  const toggle=useCallback(async()=>{
    if(streamRef.current){stop();return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:true});
      streamRef.current=s; setOn(true); setError(null);
      requestAnimationFrame(()=>{if(videoRef.current)videoRef.current.srcObject=s;});
    }catch(e){setError(e);}
  },[stop,videoRef]);
  useEffect(()=>stop,[stop]);
  return {on,error,toggle,stop};
}

/* 一格一格出現時,畫面自動跟著往下捲到剛出現的那一格,最後停在按鈕上。
   itemsRef 是存放各格 DOM 的 ref 陣列,ctaRef 是最後的按鈕。 */
function useRevealScroll(itemsRef, ctaRef, count, stagger){
  useEffect(()=>{
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    let tween = 0, stopped = false;
    /* 自己補間。不用 scrollTo({behavior:"smooth"}) 也不用 requestAnimationFrame:
       兩者在部分內嵌/預覽瀏覽器都不會動(rAF 根本不觸發),計時器才是到處都可靠的。 */
    const glideTo = top => {
      clearInterval(tween);
      const from = window.scrollY, dist = top - from, dur = 560, t0 = Date.now();
      if (Math.abs(dist) < 4) return;
      const ease = t => (t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2);
      tween = setInterval(()=>{
        if (stopped) { clearInterval(tween); return; }
        const p = Math.min((Date.now()-t0)/dur, 1);
        window.scrollTo(0, from + dist*ease(p));
        if (p >= 1) clearInterval(tween);
      }, 16);
    };

    /* 扣掉頂部固定列與底部導覽列,把該格放在真正看得到的區域中央 */
    const HEAD = 64, FOOT = 96;
    const go = el => {
      if (!el || stopped) return;
      const r = el.getBoundingClientRect();
      const view = window.innerHeight - HEAD - FOOT;
      const max = Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);
      const top = r.top + window.scrollY - HEAD - Math.max((view - r.height)/2, 12);
      glideTo(Math.min(Math.max(top, 0), max));
    };

    const timers = [];
    /* 第一格不捲:頁面本來就停在最上面,捲了反而是多餘的跳動 */
    for (let i=1; i<count; i++)
      timers.push(setTimeout(()=>go(itemsRef.current[i]), (i*stagger + 0.3)*1000));
    timers.push(setTimeout(()=>go(ctaRef.current), (count*stagger + 0.7)*1000));

    /* 使用者自己動滾輪或滑螢幕時就交還控制權,不要跟他搶 */
    const surrender = ()=>{ stopped = true; clearInterval(tween); timers.forEach(clearTimeout); };
    window.addEventListener("wheel", surrender, {passive:true, once:true});
    window.addEventListener("touchmove", surrender, {passive:true, once:true});

    return ()=>{
      surrender();
      window.removeEventListener("wheel", surrender);
      window.removeEventListener("touchmove", surrender);
    };
  },[count,stagger]);
}

        <button onClick={g.next} className={BTN+" bg-tomato px-8 py-4 text-2xl text-white md:text-3xl"}>
          <Sparkles size={26}/><RubyText g={g} k="ready"/>
        </button>
      </div>
    </div>
  );
}

/* ─── 3. 任務頁 ─── */
function MissionScreen({g}){
  const M_STAGGER=0.35;
  const cells=useRef([]); const cta=useRef(null);
  useRevealScroll(cells, cta, 2, M_STAGGER);
  return (
    <div className="mx-auto max-w-4xl px-4 pt-6">
      {/* 警報條:晃動幅度收小,避免文字讀起來暈 */}
      <div className={CARD+" flex items-center gap-3 bg-tomato p-4 text-white animate-[wiggle_2.6s_ease-in-out_infinite]"}>
        <Siren size={32} className="shrink-0"/>
        <h2 className={T.h2}><Speakable g={g} k="mTitle"/></h2>
      </div>

      <div className="mt-6 grid gap-5 md:grid-cols-2">
        {[
          {k:"m1", note:"運動比賽輸了", img:"mission1"},
          {k:"m2", note:"失落地坐在位子上", img:"mission2"},
        ].map((p,i)=>(
          <div key={p.k} ref={el=>cells.current[i]=el}
            className={CARD+" overflow-hidden animate-[popIn_.45s_both]"} style={{animationDelay:(i*M_STAGGER)+"s"}}>
            <Illo src={p.img} alt={p.note} tone="bg-sand" className="aspect-[8/5] border-b-4 border-black"/>
            <p className={"p-4 "+T.lead}><Speakable g={g} k={p.k}/></p>
          </div>
        ))}
      </div>

      <div ref={cta} className="mt-8 flex flex-col items-center gap-5 animate-[fadeUp_.5s_.9s_both]">
        <p className={"text-center "+T.h2}><Speakable g={g} k="mQ"/></p>
        <button onClick={g.next} className={BTN+" bg-mango px-8 py-3.5 text-2xl"}>
          <RubyText g={g} k="next"/><ArrowRight size={24}/>
        </button>
      </div>
    </div>
  );
}

/* ─── 4. Step 1 觀察:熱區 + 情緒選擇 ─── */
function Step1Screen({g}){
  const [hov,setHov]=useState(null);
  const [otherOpen,setOtherOpen]=useState(false);
  const [pressed,setPressed]=useState(null); /* 按壓高亮只存在本頁,返回時自動復原 */
  const hovSpot=HOTSPOTS.find(h=>h.id===hov);
  return (
    <div className="mx-auto max-w-4xl px-4 pt-6">
      <div className={CARD+" bg-creamy p-4"}>
        <p className={T.h3}><Speakable g={g} k="s1Q"/></p>
        <p className={"mt-1.5 flex items-center gap-1.5 "+T.cap}>
          <MousePointer2 size={16} className="shrink-0"/><Speakable g={g} k="s1Hint"/>
        </p>
      </div>

      {/* 觀察場景(熱區為透明層,靠微弱的呼吸光點提示可以摸哪裡) */}
      <div className="relative mt-5 aspect-[16/10] overflow-hidden rounded-2xl border-4 border-black bg-sand shadow-[6px_6px_0px_0px_#000]">
        <div className="absolute inset-x-0 top-0 h-[46%] border-b-4 border-black bg-board"/>
        <div className="absolute inset-x-0 bottom-0 h-[18%] bg-cocoa/50"/>
        {/* 上移讓眉/眼/嘴/托腮的手對齊 HOTSPOTS 熱區座標 */}
        <img src="defuser-img/step1.jpg" alt="失落的同學坐在位子上" decoding="async"
          className="illo absolute inset-0 -translate-y-[8%]"/>
        {/* 手部熱區左右重複,只保留一個(handL);框框拿掉,熱區改為隱形透明層 */}
        {HOTSPOTS.filter(h=>h.id!=="handR").map(h=>(
          <div key={h.id}
            className={"absolute cursor-help rounded-xl transition-colors duration-200 "+
              (hov===h.id?"bg-white/15":"hover:bg-white/12")}
            style={{left:h.x+"%",top:h.y+"%",width:h.w+"%",height:h.h+"%"}}
            onMouseEnter={()=>setHov(h.id)} onMouseLeave={()=>setHov(null)}
            onClick={()=>{ if(h.kind==="tip") g.say(h.strKey); }}/>
        ))}
        {/* 提示氣泡 / 眼睛放大鏡 */}
        {hovSpot && hovSpot.kind==="tip" && (
          <div className={"pointer-events-none absolute z-20 w-64 -translate-x-1/2 animate-[popIn_.22s_both] rounded-xl bg-white p-3 text-base font-bold leading-[1.8] "+L2}
            style={{left:Math.min(Math.max(hovSpot.x+hovSpot.w/2,18),82)+"%", top:(hovSpot.y+hovSpot.h+2)+"%"}}>
            <RubyText g={g} k={hovSpot.strKey}/>
          </div>
        )}
        {hovSpot && hovSpot.kind==="lens" && (
          <div className="pointer-events-none absolute z-20 animate-[popIn_.22s_both]"
            style={{left:(hovSpot.x+hovSpot.w-1)+"%", top:(hovSpot.y-10)+"%"}}>
            <div className={"relative w-60 rounded-xl bg-white p-2 "+L2}>
              <div className="h-28 w-full rounded-lg border-2 border-black"
                style={{backgroundImage:"url('defuser-img/step1.jpg')", backgroundSize:"460%", backgroundPosition:"50% 36%"}}/>
              <ZoomIn size={18} className="absolute bottom-3 right-3 rounded-full border-2 border-black bg-lemon p-0.5"/>
            </div>
          </div>
        )}
      </div>

      {/* 情緒選擇列 */}
      <div className={CARD+" mt-5 bg-white p-4"}>
        <p className={"mb-3 "+T.h3}><Speakable g={g} k="s1Me"/></p>
        {!otherOpen ? (
          <div className="flex flex-wrap gap-3">
            {EMO_KEYS.map(k=>(
              <button key={k} onClick={()=>{setPressed(k);g.pickEmotion(k);}}
                aria-pressed={pressed===k}
                className={BTN2+" px-5 py-2.5 text-xl md:text-2xl "+
                  (pressed===k?"picked bg-mango ring-2 ring-black":"bg-white hover:bg-creamy")}>
                <RubyText g={g} pair={EMO[k]}/>
              </button>
            ))}
            <button onClick={()=>setOtherOpen(true)} className={BTN2+" bg-white px-5 py-2.5 text-xl hover:bg-creamy md:text-2xl"}>
              <Pencil size={20}/><RubyText g={g} k="other"/>
            </button>
          </div>
        ) : (
          <OtherInput g={g} phKey="s1Ph"
            onSubmit={t=>g.pickEmotionOther(t)}
            onCancel={()=>setOtherOpen(false)}/>
        )}
      </div>
    </div>
  );
}

/* ─── 5. Step 1b 照鏡子 + 畫表情 ─── */
function Step1bScreen({g}){
  const videoRef=useRef(null);
  const canvasRef=useRef(null);
  const cam=useCamera({videoRef});
  const pad=useDrawingPad({canvasRef, initialImage:g.answers.draw, onChange:g.setDrawing});
  const ans=g.answers;
  const emoPair = ans.emotion==="other"
    ? {zh:ans.emotionText, en:ans.emotionText}
    : (ans.emotion ? EMO[ans.emotion] : {zh:"…",en:"…"});
  const PALETTE=["#211A12","#DD3A31","#F56B25","#FDAB3C","#109A91","#6BC6E6","#FA9EB7","#0F0F6D"];
  return (
    <div className="mx-auto max-w-5xl px-4 pt-6">
      {/* 句子:s1bA + 所選情緒 + s1bB + s1bC */}
      <div className={CARD+" bg-creamy p-4"}>
        <p className={T.h3}>
          <QLine g={g} parts={[
            {k:"s1bA"},
            {pair:emoPair, em:true},
            {k:"s1bB"},
            {k:"s1bC"},
          ]}/>
        </p>
      </div>

      {/* 深色容器:左鏡頭、右畫板(設計圖 p.8) */}
      <div className="mt-5 rounded-2xl border-4 border-black bg-[#33302B] p-5 shadow-[8px_8px_0px_0px_#000] md:p-7">
        <div className="grid gap-6 md:grid-cols-2">
          {/* 鏡頭 */}
          <div className="flex flex-col items-center gap-3">
            <h3 className="text-lg font-black text-creamy md:text-xl"><Speakable g={g} k="camCap"/></h3>
            <div className="relative aspect-[4/3] w-full overflow-hidden rounded-xl border-[3px] border-black bg-paper">
              <video ref={videoRef} autoPlay playsInline muted
                className={"h-full w-full -scale-x-100 object-cover "+(cam.on?"":"hidden")}/>
              {!cam.on && (
                <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 text-ink/35">
                  <Camera size={52} className="opacity-40"/>
                  <span className="text-sm font-bold">按下方按鈕打開鏡頭</span>
                </div>
              )}
            </div>
            <button onClick={cam.toggle}
              className={BTN2+" px-5 py-2.5 text-lg "+(cam.on?"bg-tomato text-white":"bg-skyy")}>
              {cam.on?<CameraOff size={20}/>:<Camera size={20}/>}
              <RubyText g={g} k={cam.on?"camOff":"camOn"}/>
            </button>
            {cam.error && <p className="text-center text-sm font-bold leading-relaxed text-blush">⚠ 無法開啟鏡頭(需要 https 或 localhost,並允許權限)</p>}
          </div>

          {/* 畫板 */}
          <div className="flex flex-col items-center gap-3">
            <h3 className="text-lg font-black text-creamy md:text-xl"><Speakable g={g} k="drawCap"/></h3>
            <canvas ref={canvasRef} width={480} height={360}
              className="pad aspect-[4/3] w-full cursor-crosshair rounded-xl border-[3px] border-black bg-white"/>
            {/* 畫布下方:不同顏色畫筆 + 橡皮擦 + 全部清除 */}
            <div className={"flex w-full flex-wrap items-center justify-center gap-2 rounded-xl bg-paper p-2.5 "+L2}>
              {PALETTE.map(c=>(
                <button key={c} aria-label={"畫筆 "+c} aria-pressed={pad.color===c && !pad.erase}
                  onClick={()=>{pad.setColor(c);pad.setErase(false);}}
                  className={"h-7 w-7 rounded-full border-2 border-black transition-transform duration-150 "+
                    (pad.color===c && !pad.erase ? "scale-125 ring-2 ring-black ring-offset-2 ring-offset-paper":"hover:scale-110")}
                  style={{background:c}}/>
              ))}
              <span className="mx-1 h-7 w-0.5 rounded bg-black/20"/>
              <button onClick={()=>pad.setErase(!pad.erase)} aria-pressed={pad.erase}
                className={BTN2+" rounded-lg px-3 py-1.5 text-sm shadow-[3px_3px_0px_0px_#000] "+(pad.erase?"bg-mango":"bg-white")}>
                <Eraser size={16}/><RubyText g={g} k="eraser"/>
              </button>
              <button onClick={pad.clear}
                className={BTN2+" rounded-lg bg-white px-3 py-1.5 text-sm shadow-[3px_3px_0px_0px_#000]"}>
                <Trash2 size={16}/><RubyText g={g} k="clearAll"/>
              </button>
            </div>
          </div>
        </div>
        <p className="mt-5 text-center text-base font-black leading-[1.8] text-creamy/90 md:text-lg">
          <Speakable g={g} k="s1bHint"/>
        </p>
      </div>
    </div>
  );
}

/* ─── 6/7. Step 2 思考、Step 3 行動:黑板 + 2×2 選項卡 ─── */
function ChoiceScreen({g, kind}){
  const [otherOpen,setOtherOpen]=useState(false);
  const [pressed,setPressed]=useState(null); /* 按壓高亮只存在本頁,返回時自動復原 */
  const isNeed = kind==="need";
  const parts = isNeed
    ? [{k:"s2Qa"},{k:"s2Qb",em:true},{k:"s2Qc"}]
    : [{k:"s3Qa"},{k:"s3Qb",em:true},{k:"s3Qc"}];
  const ICONS={space:CircleDashed, listen:Ear, walk:Footprints};
  const pick = k => { setPressed(k); (isNeed ? g.pickNeed(k) : g.pickAction(k)); };
  const pickOther = t => isNeed ? g.pickNeedOther(t) : g.pickActionOther(t);
  return (
    <div className="mx-auto max-w-4xl px-4 pt-6">
      <p className={"text-center "+T.h2}>
        <QLine g={g} parts={parts}/>
      </p>

      {/* 黑板 */}
      <div className="mt-5 rounded-2xl border-4 border-black bg-board p-5 shadow-[6px_6px_0px_0px_#000] md:p-8">
        <div className="grid gap-5 sm:grid-cols-2">
          {CHOICES[kind].map((c,i)=>{
            const Ic=ICONS[c.key]||Pencil;
            const on = pressed===c.key;
            return (
              <button key={c.key} onClick={()=>pick(c.key)} aria-pressed={on}
                className={CARD2+" flex flex-col items-center gap-3 p-5 text-center transition-[transform,box-shadow,background-color] duration-150 ease-out hover:-translate-y-1 hover:shadow-[7px_7px_0px_0px_#000] active:translate-y-1 active:shadow-none "+
                  (on?"picked bg-lemon ring-2 ring-black":"bg-white")}>
                <span className={"rounded-xl border-2 border-black p-3 transition-colors "+(on?"bg-mango":"bg-sand")}>
                  <Ic size={32}/>
                </span>
                <span className={T.h3}><RubyText g={g} k={c.strKey}/></span>
              </button>
            );
          })}
          {/* 其他 */}
          {!otherOpen ? (
            <button onClick={()=>setOtherOpen(true)}
              className={CARD2+" flex flex-col items-center gap-3 bg-white p-5 text-center transition-[transform,box-shadow] duration-150 ease-out hover:-translate-y-1 hover:shadow-[7px_7px_0px_0px_#000]"}>
              <span className="rounded-xl border-2 border-black bg-sand p-3"><Pencil size={32}/></span>
              <span className={T.h3}><RubyText g={g} k="other"/></span>
            </button>
          ) : (
            <div className={CARD2+" flex items-center bg-white p-4 sm:col-span-1"}>
              <OtherInput g={g} phKey={isNeed?"s2Ph":"s3Ph"}
                onSubmit={pickOther} onCancel={()=>setOtherOpen(false)}/>
            </div>
          )}
        </div>
      </div>
      {/* 粉筆溝 */}
      <div className="mx-8 h-3.5 rounded-b-xl border-[3px] border-t-0 border-black bg-cocoa"/>
    </div>
  );
}

/* ─── 8. 同學回應 ─── */
function RespScreen({g}){
  const rk=g.respKey;
  return (
    <div className="mx-auto max-w-4xl px-4 pt-6">
      {/* 場景:平靜的同學(與 Step1 同角色) */}
      <div className="relative aspect-[16/9] overflow-hidden rounded-2xl border-4 border-black bg-sand shadow-[6px_6px_0px_0px_#000]">
        <div className="absolute inset-x-0 top-0 h-1/2 border-b-4 border-black bg-board"/>
        <Illo src="resp" alt="平靜下來的同學" tone="bg-transparent" className="absolute inset-0"/>
      </div>

      {/* 對話泡泡 */}
      <div className="relative mx-auto -mt-8 max-w-2xl">
        <div className={CARD+" relative bg-white p-6 animate-[popIn_.45s_.2s_both]"}>
          <span className="absolute -top-3.5 left-12 h-7 w-7 rotate-45 border-l-4 border-t-4 border-black bg-white"/>
          <MessageCircle size={20} className="absolute right-4 top-4 text-ink/25"/>
          {rk
            ? <p className={"pr-6 "+T.h2}><Speakable g={g} k={rk}/></p>
            : <p className={T.lead+" text-ink/50"}>請先回上一步選擇你的行動喔!</p>}
        </div>
      </div>

      <div className="mt-8 flex justify-end animate-[fadeUp_.5s_.9s_both]">
        <button onClick={g.next} className={BTN+" bg-lemon px-6 py-3.5 text-xl md:text-2xl"}>
          <Users size={24}/><RubyText g={g} k="peersBtn"/>
        </button>
      </div>
    </div>
  );
}

/* ─── 9. 結尾:黑板八泡泡 + 同理心愛心 ─── */
const END_STAGGER = 0.32; /* 原本 0.5s×9 要等 4.5 秒才看得到按鈕,收緊節奏 */
function EndScreen({g}){
  return (
    <div className="mx-auto max-w-5xl px-4 pt-6">
      <div className="rounded-2xl border-4 border-black bg-board p-5 shadow-[6px_6px_0px_0px_#000] md:p-8">
        {/* items-start:讓每個泡泡保持自然高度,不被同一列最高的愛心撐開留白 */}
        <div className="grid items-start gap-4 md:grid-cols-3">
          {END_ORDER.map((k,i)=>{
            if(k==="HEART") return (
              <div key={k} className="flex flex-col items-center justify-center gap-1 self-center py-2 animate-[popIn_.5s_both]"
                style={{animationDelay:(i*END_STAGGER)+"s"}}>
                <div className="relative">
                  <Heart size={132} strokeWidth={1.4} className="text-black drop-shadow-[5px_5px_0px_rgba(0,0,0,.5)]" fill="#F56B25"/>
                  <span className="absolute inset-0 flex items-center justify-center pb-2 text-xl font-black leading-[1.4] text-white">
                    <RubyText g={g} k="endHeart" rt="text-white"/>
                  </span>
                </div>
                <p className="text-base font-black text-white md:text-lg"><Speakable g={g} k="endSteps"/></p>
              </div>
            );
            return (
              <div key={k} className={"rounded-xl bg-[#EDF6EE] p-4 animate-[popIn_.45s_both] "+L3}
                style={{animationDelay:(i*END_STAGGER)+"s"}}>
                <p className="text-[15px] font-bold leading-[1.85]">
                  <Speakable g={g} k={k}/>
                </p>
              </div>
            );
          })}
        </div>
      </div>
      <div className="mx-8 h-3.5 rounded-b-xl border-[3px] border-t-0 border-black bg-cocoa"/>

      {/* ─── 想一想:課堂討論用的回顧問題(暖色框,和黑板上的同學留言區隔開) ─── */}
      <div className="mt-8 animate-[fadeUp_.5s_both]"
        style={{animationDelay:(END_ORDER.length*END_STAGGER+0.2)+"s"}}>
        <div className="mb-4 flex items-center justify-center gap-2">
          <span className={"inline-flex items-center gap-2 rounded-full bg-lemon px-5 py-1.5 text-xl font-black "+L3}>
            <Brain size={22}/><RubyText g={g} k="q0"/>
          </span>
        </div>
        <div className="grid gap-4 md:grid-cols-3">
          {[
            {k:"q1", bg:"bg-creamy", ic:Sparkles},
            {k:"q2", bg:"bg-blush/45", ic:HandHeart},
            {k:"q3", bg:"bg-skyy/45", ic:RotateCcw},
          ].map(({k,bg,ic:Ic},i)=>(
            <div key={k} className={CARD2+" flex gap-3 p-4 "+bg}>
              <span className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 border-black bg-white">
                <Ic size={18}/>
              </span>
              <p className="text-[15px] font-bold leading-[1.85]">
                <Speakable g={g} k={k}/>
              </p>
            </div>
          ))}
        </div>
      </div>

      {/* 再玩一次 / 下載我的答案(泡泡跑完才出現) */}
      <div className="mt-8 flex flex-wrap items-center justify-center gap-4 pb-10 animate-[fadeUp_.5s_both]"
        style={{animationDelay:(END_ORDER.length*END_STAGGER+0.35)+"s"}}>
        <button onClick={()=>g.download({fontFamily:"'Huninn','Noto Sans TC',sans-serif"})}
          className={BTN+" bg-mango px-7 py-3.5 text-2xl"}>
          <Download size={24}/><RubyText g={g} k="dl"/>
        </button>
        <button onClick={g.restart} className={BTN2+" bg-white px-6 py-3 text-xl"}>
          <RotateCcw size={22}/><RubyText g={g} k="again"/>
        </button>
      </div>
    </div>
  );
}

/* ─── 主容器 ─── */
const IMG_NAMES=["comic1","comic2","comic3","comic4","mission1","mission2","step1","resp"];
function App(){
  const g = useEmotionDefuser({initialLang:"zh"});
  /* 一開始就預先載入+解碼所有插圖,避免換頁到同學圖時卡頓 */
  useEffect(()=>{ IMG_NAMES.forEach(n=>{ const im=new Image(); im.src="defuser-img/"+n+".jpg"; }); },[]);
  /* 換頁時回到卷軸最頂端 */
  useEffect(()=>{ window.scrollTo({top:0, left:0, behavior:"instant"}); },[g.screen]);
  const SCREENS = {
    start:StartScreen, comic:ComicScreen, mission:MissionScreen,
    step1:Step1Screen, step1b:Step1bScreen,
    step2:()=> <ChoiceScreen g={g} kind="need"/>,
    step3:()=> <ChoiceScreen g={g} kind="action"/>,
    resp:RespScreen, end:EndScreen,
  };
  const Scr = SCREENS[g.screen];
  /* 注音模式下段落行高要放鬆,直排注音才不會擠到上一行 */
  return (
    <div className={"min-h-screen "+(g.lang==="zy"?"zy-mode":"")}>
      {g.screen!=="start" && <Hud g={g}/>}
      {/* 過場:平滑下移 */}
      <main key={g.screen} className="screen-in pb-28">
        <Scr g={g}/>
      </main>
      {g.screen!=="start" && FLOW[g.screen] && <NavBar g={g}/>}
      {g.splash && <Splash g={g}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
